name: nightly-tenant
# Runs the kit against a real demo tenant every night, with its own prefix (SE-CI) and test user, so it never touches
# the SE-Demo objects you demo with. Steps and safety: tools/nightly.py. Needs repository secrets (Settings > Secrets and
# variables > Actions): SE_KIT_CLIENT_ID, SE_KIT_VANITY_DOMAIN, SE_KIT_ONEAPI_CLIENT_SECRET, optional SE_KIT_CLOUD.
# Without them the job skips. On failure it opens (or comments on) an issue labeled nightly-tenant.
# GitHub runs scheduled workflows from the default branch, so the nightly run starts once this file is on main.
on:
  schedule:
    - cron: "17 9 * * *"   # 5:17 AM New York time (EDT), every day
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency: nightly-tenant
jobs:
  tenant:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install "zscaler-sdk-python>=1.11" "requests>=2.31" "keyring>=24" "truststore>=0.9"
      - name: Run the nightly tenant test
        id: run
        env:
          SE_KIT_CLIENT_ID: ${{ secrets.SE_KIT_CLIENT_ID }}
          SE_KIT_VANITY_DOMAIN: ${{ secrets.SE_KIT_VANITY_DOMAIN }}
          SE_KIT_ONEAPI_CLIENT_SECRET: ${{ secrets.SE_KIT_ONEAPI_CLIENT_SECRET }}
          SE_KIT_CLOUD: ${{ secrets.SE_KIT_CLOUD }}
        run: python tools/nightly.py
      - name: Open or update an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create nightly-tenant --color B60205 --description "Nightly tenant test failures" 2>/dev/null || true
          n=$(gh issue list --label nightly-tenant --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Failed again: $RUN_URL"
          else
            gh issue create --label nightly-tenant --title "Nightly tenant test failed" \
              --body "The nightly test against the demo tenant failed: $RUN_URL (see the run summary for the failing step). Close this issue once it passes again."
          fi
