name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest pyflakes requests keyring truststore
      - run: pyflakes aiguard_kit.py tests tools
      - run: pytest -q tests
      - run: python tools/build_plugin.py --check
      - run: python tools/gen_preflight_doc.py --check
      - name: Launcher starts the kit (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          pip install uv
          aiguard-kit.cmd help | findstr /C:"aiguard-kit.cmd setup"
